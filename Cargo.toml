[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Kanata's TCP protocol types. This crate does NOT follow semver, so it is pinned
# exactly; bump it together with the Kanata version you test against.
kanata-tcp-protocol = "=1.1130.0"
kle-serial = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
# prctl(PR_SET_PDEATHSIG), getppid, kill: constitution III.
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

kanata-client = { path = "crates/kanata-client" }
layout = { path = "crates/layout" }
settings = { path = "crates/settings" }
kbd = { path = "crates/kbd" }

# Layer-shell probe (research R4).
wayland-client = "0.31"

# Tray icons per device without Qt Widgets (feature 007, research R1); async-io
# is the backend zbus needs underneath the blocking API (no runtime of ours).
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
