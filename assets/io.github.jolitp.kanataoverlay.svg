<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Kanata Overlay: layers (the tray's layer colours) stacked under a keycap. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#d5dae1"/>
    </linearGradient>
  </defs>
  <!-- three layers, back to front -->
  <rect x="18" y="6"  width="40" height="34" rx="7" fill="#d97706"/>
  <rect x="12" y="14" width="40" height="34" rx="7" fill="#16a34a"/>
  <rect x="6"  y="22" width="40" height="34" rx="7" fill="#3b82f6"/>
  <!-- the keycap on the front layer -->
  <rect x="13" y="28" width="26" height="22" rx="5" fill="#1e293b" opacity="0.35"/>
  <rect x="12" y="26" width="26" height="22" rx="5" fill="url(#cap)"/>
  <rect x="15" y="28.5" width="20" height="15" rx="3.5" fill="#ffffff" opacity="0.55"/>
  <!-- a "K" legend -->
  <path d="M20 31 v12 M20 37.5 L28 31 M22.6 35.6 L28.5 43" stroke="#1e293b" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
